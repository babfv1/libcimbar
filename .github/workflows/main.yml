name: Build Windows Release
on: [workflow_dispatch] # 允许手动触发

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive # 必须拉取子模块

    - name: Install vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: master

    - name: Install Dependencies (OpenCV & GLFW)
      run: vcpkg install opencv:x64-windows glfw3:x64-windows

    - name: Configure and Build
      run: |
        mkdir build && cd build
        cmake .. -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake -A x64
        cmake --build . --config Release -j 4

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: libcimbar-windows-exe
        path: build/Release/cimbar.exe
