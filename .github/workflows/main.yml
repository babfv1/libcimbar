name: Build Windows Release
on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup and Install vcpkg & Dependencies
      run: |
        git clone https://github.com/microsoft/vcpkg.git
        cd vcpkg
        .\bootstrap-vcpkg.bat
        .\vcpkg install opencv:x64-windows glfw3:x64-windows

    - name: Patch CMakeLists (Disable Tests & Strict Warnings)
      run: |
        # 遍历项目中所有的 CMakeLists.txt
        Get-ChildItem -Path . -Filter CMakeLists.txt -Recurse | ForEach-Object {
            $content = Get-Content $_.FullName
            # 物理注释掉所有的测试子目录
            $content = $content -replace 'add_subdirectory\s*\(\s*test\s*\)', '# disabled test'
            # 强行移除警告转错误标志
            $content = $content -replace '-Werror', ''
            $content = $content -replace '/WX', ''
            Set-Content -Path $_.FullName -Value $content
        }

    - name: Configure and Build libcimbar
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake -A x64
        # 再次执行多线程编译
        cmake --build . --config Release -j 4

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: libcimbar-windows-exe
        # 使用通配符全目录搜索生成的 exe 文件，确保万无一失
        path: '**/*/cimbar.exe'
